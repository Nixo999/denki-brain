<!-- ===== hero-foto-laterale =====
  Origine: Groavel, ~/lavoro/groavel-site, commit a6a1751 (src/pages/index.astro «Ritrovo», stile.css «Hero»).
  Nicola su Groavel, dal telefono (29/10, commit 14b57be e 9df4fe5): testo e bottoni al centro sotto i 900 px,
  e via la foto dall'hero. Sul sito intero: «con quello siamo sulla strada giusta» (30/10).
  Regole che la forma rispetta: l'h1 e' il nome del cliente e la sua frase sta sotto, piccola (14/09: «un titolo
  con il suo nome e una frase sotto in piccolo»); la foto e' piccola e di lato, mai a tutta larghezza (07/10);
  da computer lo spazio si usa su due colonne (07/10).
  ATTENZIONE, due direttive tirano in versi opposti. Groavel sul telefono non ha la foto (Nicola, 29/10), ma lo
  stesso giorno su OperO: «linizio con solo la scritta grande non mi pice, metti delle immagini». Per questo qui
  sotto i 900 px la foto resta, piccola, sotto i bottoni, ed entra nel primo schermo a 375x812. La classe
  hero-fl--senza-foto-telefono rifa' Groavel com'e': si usa solo se nel primo schermo c'e' comunque un'immagine.
  Foto: 1, verticale 4:5, almeno 1080 px sul lato lungo (a schermo e' larga al massimo 340 px). Sul telefono
  la stessa foto si vede in 3:2: il soggetto va tenuto al centro, o si sposta con object-position. Facoltativo:
  il logo del cliente in PNG trasparente da 512 px, che sta dietro al testo all'8% (la «ruota» di Groavel).
  Testi da scrivere: il nome (h1), una frase sotto (una sola, con soggetto e verbo), una riga in carattere di
  dettaglio con citta' e fatti verificabili, due bottoni (contatto e sezione principale).
  File: hero-foto-laterale.html + .css. Nessun JS: l'entrata vive in CSS sotto .js:not(.cattura) e a riposo
  la pagina e' gia' nello stato finale. Va subito dopo la barra-fissa. -->
