  stile.css «Giro 3 Le cuciture»). Non e' una sezione: e' il raccordo fra due sezioni di campo diverso.
  Nicola: «fai in modo di non far vedere lattaccatura dei diversi livelli della pagina [...] metti gli sfondi in
  modo che si mischino tra loro con delle righe disegnate colorate o altro, animando magari anche la transizione»
  (26/10); poi sul giro 3: «meglio, ma sistema questa separazione», per una riga dritta rimasta sotto la curva
  (26/10). Regola: il bordo fra due campi segue una curva e si chiude esattamente sul colore che entra (28/10).
  Cos'e', e cosa non e': una curva morbida con tre righe parallele, non un disegno figurativo. Nicola il 31/10 ha
  tolto l'obbligo della grafica inventata, non l'ha vietata; il controllo «disegni-nostri» di
  cancelli-telefono.mjs lo segnala come avviso, perche' e' un SVG inline piu' largo di 80 px.
  Se due sezioni vicine hanno lo stesso campo, il passaggio non serve: si mette solo dove il campo cambia, e il
  campo non cambia a ogni sezione (28/10: «il colore è sempre diverso e sembra una roba buttata lì a caso»).
  Come si usa: si mette fra due <section class="sezione ...">. Le due classi dicono da che campo si esce
  (passaggio--da-...) e in che campo si entra (passaggio--a-...): fondo, superficie, superficie-2, piede. La
