<!-- ===== sedi-elenco =====
  Origine: NG Barber Studio, ~/lavoro/ngbarber-site, commit 648187b (index.html, capitolo «SEDI», l'unico pin
  della pagina: la sede attiva si accende mentre si scorre, le altre restano spente).
  Nicola: «NG Barber e Fiftynine passano, gli altri no» (il metro, direttive-siti); «per NG Barber non gli ho
  detto niente e ha fatto un sito bellissimo» (11/09).
  Cosa e' cambiato rispetto a NG Barber, e perche':
  - al posto del globo del logo ridisegnato in SVG c'e' la foto della sede attiva: il logo del cliente non si
    ridisegna (16/09 e 19/09) e Trevis non disegna (12/10);
  - niente pin con scrub: la cornice sta ferma con position:sticky e la sede attiva cambia a meta' schermo, come
    in scena-tappe. Lo scrub a 1 trascinava («lanimazione allo scrol [...] sembra troppo lenta», 20/10);
  - sul telefono niente cornice: ogni sede porta la sua foto piccola, e sono tutte accese (come in NG Barber);
  - via la numerazione «02 — Dove siamo» sopra la lista (07/10), e il paese passa sotto il nome della citta':
    un'etichetta sopra il titolo e' fra le cose che craft-floor di impeccable rifiuta.
  Serve a un cliente con due o piu' sedi, o con piu' luoghi di lavoro fissi. Con una sede sola si usa
  orari-adesso.
  Foto: una per sede, la facciata o l'interno, almeno 1080 px, verticale 4:5.
  Testi da scrivere: titolo (h2), per ogni sede il paese o la zona, la citta' (h3), l'indirizzo, il link a
  Google Maps con l'indirizzo vero; facoltativa una riga col telefono.
  File: sedi-elenco.html + .css + .js. Senza JS tutte le sedi sono accese e la cornice mostra la prima foto. -->
