<!-- ===== galleria-irregolare =====
  Origine: Groavel, ~/lavoro/groavel-site, commit a6a1751 (index.astro «Memories» e memories.astro, stile.css
  «.griglia-foto», schede.css «/memories»).
  Nicola: «da telefono risulta un po troppo ripetitivo e muro di foto, prova magari a disporle in modi piu
  particolari in base alla pagina, e da telefono togline giusto un paio in modo che non sembri un muro di foto»
  (26/10). Da qui: lo schema cambia a ogni riga, mai piu' di tre foto di fila da computer e due sul telefono,
  e una foto si nasconde sotto i 900 px. Niente didascalie sotto le foto (17/09: «frasi sotto le foto dei tagli»
  nell'elenco delle cose da togliere; 21/09: una didascalia che descrive la foto non aggiunge niente).
  Schema con 6 foto. Da 900 px tre colonne a righe larga+stretta, stretta+larga, larga+stretta: la larga prende
  due colonne in 3:2, la stretta accanto riempie l'altezza della riga. Sotto 900 px due colonne: larga, coppia,
  larga, larga; la sesta non si mostra. Per piu' foto si ripete il gruppo di sei (l'ordine e' calcolato per
  chiudere le righe senza buchi: schede.css di Groavel spiega il caso a 22 foto).
  Foto: 6, almeno 1080 px. Le larghe orizzontali (3:2), le strette verticali (4:5). Un trattamento solo per
  tutte: nessun filtro diverso foto per foto.
  Testi da scrivere: il titolo (h2) e il link al profilo o alla pagina con tutte le foto. Solo il testo
  alternativo per ogni foto, che dice cosa si vede.
  File: galleria-irregolare.html + .css. Nessun JS: le foto entrano con .rivela di base.css. -->
