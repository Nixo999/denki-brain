<!-- ===== barra-fissa =====
  Origine: Groavel, ~/lavoro/groavel-site, commit a6a1751 (src/components/Barra.astro, stile.css «Barra»).
  Nicola: «da telefono la navbar non va bene perche è appiccicata al titolo e comunque è scomoda una nav bar
  così da telefono» (20/10, direttive-siti). Da qui: sotto 1024 px le voci stanno in un menu che si apre a
  parte, e fra la barra e il titolo ci sono almeno 16 px (la sezione sotto parte da var(--barra) + 32 px).
  Foto: nessuna. Serve il logo del cliente in PNG o SVG, quadrato, almeno 96 px (88 px a schermo da computer
  su un telefono a doppia densita'). Il logo vero, mai ridisegnato (direttive 16/09 e 19/09).
  Testi da scrivere: il nome del cliente, da 3 a 5 voci di menu che puntano alle sezioni, il bottone di
  contatto (un verbo e il canale: «Scrivici», «Prenota»).
  File: barra-fissa.html + barra-fissa.css + barra-fissa.js. Il JS e' facoltativo: senza, il menu si apre e
  si chiude lo stesso (<details>), manca solo l'ombra quando si scende e la chiusura con Esc.
  La barra va subito dentro <body>, prima di <main>. -->
