<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
(function(){
  var doc = document.documentElement;
  var cattura = new URLSearchParams(location.search).has('cattura');
  var fermo = matchMedia('(prefers-reduced-motion: reduce)').matches;

  doc.classList.add('js');
  if (cattura) doc.classList.add('cattura');

  // Rivelazioni allo scroll. Il fallback a tempo scatta SOLO a scheda nascosta:
  // in una scheda che dipinge l'observer arriva, e un timer lo ucciderebbe.
  var rivela = document.querySelectorAll('.rivela');
  if (cattura || fermo || !('IntersectionObserver' in window)) {
    rivela.forEach(function(el){ el.classList.add('dentro'); });
  } else {
    var oss = new IntersectionObserver(function(voci){
      voci.forEach(function(v){
        if (v.isIntersecting) { v.target.classList.add('dentro'); oss.unobserve(v.target); }
      });
    }, { rootMargin: '0px 0px -12% 0px' });
    rivela.forEach(function(el){ oss.observe(el); });
    setTimeout(function(){
      if (document.visibilityState === 'hidden')
        rivela.forEach(function(el){ el.classList.add('dentro'); });
    }, 1200);
  }

  // A pane nascosto il viewport è 0×0 e i trigger si calcolano su una finestra
  // inesistente: si ricalcolano quando la scheda torna visibile.
  if (window.gsap && window.ScrollTrigger) {
    gsap.registerPlugin(ScrollTrigger);
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible') ScrollTrigger.refresh();
    });
  }

  // --- APERTURA -------------------------------------------------------------
  // Obbligatoria su ogni sito, e diversa su ogni sito: è il primo secondo, ed è
  // quello che fa sembrare il sito vero invece che generato.
  // Vive in CSS (`.js:not(.cattura) …{animation:…both}`) così lo stato a riposo
  // resta quello finale. Se serve una timeline GSAP, va qui — con il timer di
  // sicurezza: rAF è fermo nei tab in background e un sipario resterebbe eterno.
  var sipario = document.querySelector('.sipario');
  if (sipario) {
    var chiudi = function(){ sipario.remove(); };
    if (cattura || fermo || !window.gsap) chiudi();
    else { gsap.timeline({ onComplete: chiudi }).to(sipario, { autoAlpha: 0, duration: .6 });
           setTimeout(chiudi, 4000); }
  }
})();
</script>
