# Statico puro: niente build, la root e' gia' il sito.
[build]
  publish = "."
  command = ""

# Sbarramento 2 di 3. Si toglie quando il sito diventa suo.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# CSS e JS si rivalidano a ogni caricamento (Netlify usa l'ETag): senza questo
# il telefono del cliente tiene il foglio di stile vecchio per una settimana e
# la correzione online non si vede. Pagata su sito-osteria-tarilli.
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Le foto non cambiano: cache lunga solo a loro.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Sbarramento dei file di lavoro. Brief, mondo, verita' di prodotto e le
# cartelle degli strumenti sono materiale interno: su Shaddai, il 17/09/2026,
# al primo deploy rispondevano 200 e chiunque avesse il link li leggeva.
# `force = true` serve perche' senza quello un file che esiste davvero viene
# servito lo stesso. Righe nuove da aggiungere qui se il sito ne porta altri.
[[redirects]]
  from = "/BRIEF.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/MONDO.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/PRODUCT.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/DESIGN.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/.impeccable/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/.claude/*"
  to = "/index.html"
  status = 404
  force = true
